
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سبد خرید | سبدنو</title>

  <link rel="stylesheet" href="card.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">س</span>
        سبدنو
      </a>

      <a href="index.html" class="back-link">
        ادامه خرید
      </a>
    </div>
  </header>

  <main class="main-content">
    <section class="card_page">
      <h1>سبد خرید</h1>

      <p class="description">
        محصولاتی که انتخاب کرده‌اید:
      </p>

      <div id="cartProducts" aria-live="polite">
        در حال بارگذاری محصولات...
      </div>

      <div class="cart-summary">
        <p>
          تعداد کالاها:
          <strong id="totalCount">۰</strong>
        </p>

        <p>
          مجموع قیمت:
          <strong id="totalPrice">۰ تومان</strong>
        </p>
      </div>

      <button
        type="button"
        class="sabt_sefaresh"
        id="submitOrder"
      >
        ثبت سفارش
      </button>

      <p class="order-note">
        ثبت سفارش واقعی هنوز به سیستم پرداخت یا سرور متصل نیست.
      </p>

      <a href="index.html" class="continue-link">
        بازگشت به صفحه اصلی
      </a>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="card.js"></script>
</body>
</html>
