<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام / پروفایل</title>
    <!-- <link href="style.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./output.css">
    <link rel="icon" href="logo for web-site.png">
</head>
<body>
    <header class="header" id="header">
  <div class="container header-inner">
    <nav class="nav" id="nav" aria-label="منوی اصلی">
    </nav>
  </div>
    </header>
<form class="Login-form" id="signupForm">
    <h2>ثبت نام</h2>
<label for="username">
    نام کاربری
</label>
    <input
    type="text"
    id="username"
    placeholder="نام کاربری: "
    required
>
<label for="password">
    رمزی برای امنیت
</label>
    <input
    type="password"                                        
    id="password"
    placeholder="رمزی رو دلخواه انتخاب کن: "
    required
>
<p id="p_in_lo"></p>
<!-- class="text-2xl text-red-500 text-center">در انتخاب رمز کوشا باشید! -->
<p id="message"></p>
<div class="buttons">

    <button
    type="submit"
    class="Login-Btn"
>ثبت نام</button>
</div>
</form>

<div class="Login-form" id="profile">
    <h2>پروفایل من</h2>

    <p>
        پنل کاربری
    </p>
    اطلاعات شما: 
    <div>    
    <span id="profileUsername"></span>
    </div>
    <div>
    <span id="profilepassword"></span>
    </div>    
    <button class="Login-Btn" id="log-out">خروج</button>
</div>
<script src="login.js"></script>
</body>
</html>
